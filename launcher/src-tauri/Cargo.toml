[package]
name = "velora-launcher"
description = "Velora Minecraft launcher"
version = "1.3.2"
edition.workspace = true

[lib]
name = "velora_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
velora-shared.workspace = true
velora-launcher-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
futures.workspace = true
uuid.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
chacha20poly1305 = "0.10"

# Secrets are encrypted with a key kept in the OS credential store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
