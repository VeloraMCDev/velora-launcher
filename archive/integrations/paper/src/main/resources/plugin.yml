name: SCOPENET
prefix: Velora
version: '${version}'
main: net.scopenet.paper.ScopenetPlugin
api-version: '1.20'
description: Velora private authentication, access control and activity reporting.
load: STARTUP
softdepend: [LuckPerms, PlaceholderAPI, Vault, CoreProtect, WorldGuard, WorldEdit, spark]

commands:
  scopenet:
    permission: scopenet.command.scopenet
    description: Velora server commands, status, and help
    aliases: [sn, velora]
  map:
    permission: scopenet.command.scopenet.status
    description: Show live map rendering and upload progress
  spawn:
    permission: scopenet.command.spawn
    description: Teleport to the server spawn point
    aliases: [hub, lobby]
  home:
    permission: scopenet.command.home
    description: Teleport to one of your homes or open the homes GUI
    aliases: [homes]
  sethome:
    permission: scopenet.command.sethome
    description: Set a new home location
    aliases: [createshome]
  delhome:
    permission: scopenet.command.delhome
    description: Delete an existing home
    aliases: [rmhome]
  back:
    permission: scopenet.command.back
    description: Return to your previous location or death point
    aliases: [return]
  tpa:
    permission: scopenet.command.tpa
    description: Request to teleport to another player
  tpaccept:
    permission: scopenet.command.tpaccept
    description: Accept an incoming teleport request
    aliases: [tpyes]
  tpdeny:
    permission: scopenet.command.tpdeny
    description: Deny an incoming teleport request
    aliases: [tpno]
  rtp:
    permission: scopenet.command.rtp
    description: Teleport to a random safe location in the wilderness
    aliases: [wild, randomtp]
  warp:
    permission: scopenet.command.warp
    description: Teleport to a server warp or open the warps GUI
    aliases: [warps]
  reqwarp:
    permission: scopenet.command.reqwarp
    description: Request a new public warp at your location
  warprequests:
    permission: scopenet.command.warp.manage
    description: List pending warp requests
  warpapprove:
    permission: scopenet.command.warp.manage
    description: Approve a pending warp request
  warpdeny:
    permission: scopenet.command.warp.manage
    description: Deny a pending warp request
  setwarp:
    permission: scopenet.command.warp.manage
    description: Set a public warp at your location
  delwarp:
    permission: scopenet.command.warp.manage
    description: Delete a public warp
  playtime:
    permission: scopenet.command.playtime
    description: Check total and session playtime
    aliases: [ontime]
  hand:
    permission: scopenet.command.hand
    description: Share your held item in chat
  handview:
    permission: scopenet.command.hand
    description: Inspect a shared item
  nick:
    permission: scopenet.command.nick
    description: Set or remove your chat nickname
  balance:
    permission: scopenet.command.balance
    description: Check your server economy balance
    aliases: [bal, money]
  pay:
    permission: scopenet.command.pay
    description: Send money to another player
  baltop:
    permission: scopenet.command.baltop
    description: View the richest players on the server
    aliases: [richest]
  shop:
    permission: scopenet.command.shop
    description: Open the interactive server shop GUI
  sell:
    permission: scopenet.command.sell
    description: Open the item selling GUI
  market:
    permission: scopenet.command.market
    description: Open the player marketplace GUI
    aliases: [ah, auction]
  orders:
    permission: scopenet.command.orders
    description: The buy order board - request items, pick up an order and hand the items in
    aliases: [buyorder, bo]
  contracts:
    permission: scopenet.command.contracts
    description: Your randomly generated contracts - kill mobs or hand in resources for money
    aliases: [contract]
  trade:
    permission: scopenet.command.trade
    description: Request a secure trade with another player
  transactions:
    permission: scopenet.command.transactions
    description: View recent economy transactions
  guild:
    permission: scopenet.command.guild
    description: Guild management, members, claims, and relations
    aliases: [g, clan]
  claim:
    permission: scopenet.command.claim
    description: Claim the current chunk for your guild
  unclaim:
    permission: scopenet.command.unclaim
    description: Unclaim the current chunk
  autoclaim:
    permission: scopenet.command.claim
    description: Claim chunks as you walk into them


  quests:
    permission: scopenet.command.quests
    description: See your daily and weekly quests, or another player's
    aliases: [quest, dailies]
  cosmetic:
    permission: scopenet.command.cosmetic
    description: See your unlocked cosmetics and put them on or take them off
    aliases: [cosmetics, wardrobe]
  shopkeeper:
    permission: scopenet.command.market.point
    description: Create shopkeeper NPCs that open the market
    aliases: [npcshop]
  heal:
    permission: scopenet.command.heal
    description: Restore your health
  feed:
    permission: scopenet.command.feed
    description: Restore your hunger
  fly:
    description: Fly freely (needs free.fly, or guild.fly inside your own guild's land)
  vault:
    permission: scopenet.command.vault
    description: Open a portable vault, e.g. /vault 2
    aliases: [pv]
  echest:
    permission: scopenet.command.echest
    description: Open your ender chest from anywhere
    aliases: [ec, enderchest]
  kit:
    permission: scopenet.command.kit
    description: Claim a kit, or list the kits you can claim
    aliases: [kits]
  customitem:
    permission: scopenet.admin.customitem
    description: Give one of the custom items designed in the admin panel
    aliases: [citem]
  adminclaim:
    permission: scopenet.admin.claims
    description: Create and edit admin claims (protected server land)
    aliases: [aclaim]

permissions:
  scopenet.content.place:
    description: Place blocks, chests, decorations, NPCs, vehicles, crops and mobs from the Content Studio
    default: true
  scopenet.content.break:
    description: Pick up (sneak + right-click) or break placed Content Studio props
    default: true
  scopenet.content.admin:
    description: Remove NPCs and mobs, and spawn content anywhere
    default: op
  scopenet.admin.kits:
    description: Create kits from inventory
    default: op
  scopenet.command.quests:
    description: Use /quests
    default: true
  scopenet.command.cosmetic:
    description: Use /cosmetic
    default: true
  scopenet.command.heal:
    description: Use /heal
    default: true
  scopenet.command.heal.others:
