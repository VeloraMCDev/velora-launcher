pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'scopenet-integrations'
include 'common'
// Velora Core is Fabric 1.20.1 only. Paper, Forge and modern-version builds live in ../archive/integrations.
if (providers.gradleProperty('loader').orNull == 'fabric') include 'fabric'
// Velora Core (Client), Fabric 1.20.1.
if (providers.gradleProperty('loader').orNull == 'fabric-client') include 'fabric-client'
