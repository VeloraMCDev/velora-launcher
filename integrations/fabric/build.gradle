plugins { id 'fabric-loom' version '1.8.13' }
def mc = (providers.gradleProperty('mcVersion').orNull ?: project.findProperty('mcVersion') ?: '1.20.1').toString().trim()
if (mc != '1.20.1') throw new GradleException("Velora Core targets Minecraft 1.20.1 (got '${mc}'); other versions are archived under archive/integrations")
def targetJava = mc == '1.20.1' ? 17 : 21
loom { mixin { defaultRefmapName = 'velora.refmap.json' } }
if (providers.gradleProperty('verifyMixins').isPresent()) {
    loom { runs { server { vmArg '-Dvelora.verifyMixins=true' } } }
}
if (providers.gradleProperty('verificationRunDir').isPresent()) {
    loom { runs { server { runDir providers.gradleProperty('verificationRunDir').get() } } }
}
java.sourceCompatibility = JavaVersion.toVersion(targetJava)
java.targetCompatibility = JavaVersion.toVersion(targetJava)
def features = mc == '1.20.1'   // commands, permissions, economy, client link: Fabric API based, 1.20.1 only for now
dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    implementation project(':common')
    if (features) {
        modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
        // Optional at runtime: present only when the LuckPerms mod is installed.
        compileOnly 'net.luckperms:api:5.4'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
if (features) sourceSets.main.java.srcDirs += ['src/mc1.20.1/java', '../velora-core/src/minecraft/java']
if (features) sourceSets.test.java.srcDir 'src/mc1.20.1/test'
sourceSets.main.java.srcDirs += ['../minecraft/src/main/java', "../minecraft/src/${mc}/java"]
sourceSets.main.resources.srcDirs += ['../minecraft/src/main/resources', "../minecraft/src/${mc}/resources"]
apply from: '../minecraft/build-info.gradle'
processResources {
    inputs.properties(version: project.version, mc: mc, java: targetJava, coreMixin: features ? 'velora.core.mixins.json' : 'velora.core-disabled.mixins.json')
    filesMatching('fabric.mod.json') { expand(version: project.version, mc: mc, java: targetJava, coreMixin: features ? 'velora.core.mixins.json' : 'velora.core-disabled.mixins.json') }
}
jar {
    archiveBaseName = "velora-core-server-${mc}"
    from project(':common').sourceSets.main.output
}
base.archivesName = "velora-core-server-${mc}"
