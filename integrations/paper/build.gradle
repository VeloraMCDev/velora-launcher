// Keep the Bukkit 1.20.1 API baseline and Java 17 bytecode for compatibility.
// One JAR serves every Paper version from 1.20 up (1.20.1, 1.21.x, 26.x): it only uses the stable Bukkit API, never NMS.
def paperTarget = '1.20+'

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
}
dependencies {
    implementation project(':common')
    implementation project(':api')
    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    // Optional integrations: the plugin detects these at runtime and works without them.
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') { exclude group: 'org.bukkit' }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand(version: project.version) }
}
jar {
    archiveBaseName = "scopenet-paper"
    manifest { attributes('Implementation-Version': project.version, 'SCOPENET-Minecraft-Target': paperTarget) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.output
    from project(':api').sourceSets.main.output
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') && !it.name.startsWith('common-') && !it.name.startsWith('api-') }.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
