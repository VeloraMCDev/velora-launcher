name: Deployment contracts and probe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deployment-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  contracts-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.worker-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.worker-artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash -n scripts/hermes-preflight.sh
      - run: node scripts/generate-artifact-validator.mjs --check
      - run: npm run test:deployment
      - run: node --test tests/control-plane-*.test.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx --no-install wrangler types control-plane/worker-configuration.d.ts --config control-plane/wrangler.jsonc --strict-vars=false --include-runtime=false --check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx --no-install tsc -p control-plane/tsconfig.json
      - run: npx --no-install wrangler deploy --config control-plane/wrangler.jsonc --dry-run --outdir dist/control-plane
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/check-workflows.mjs
      - run: node scripts/worker-artifact.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: worker-artifact
        with:
          name: control-plane-worker-${{ github.sha }}
          path: |
            control-plane/dist/control-plane/index.js
            control-plane/dist/control-plane/artifact-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Build disposable validation image (not a release artifact)
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: docker build --platform linux/amd64 --build-arg BUILD_REVISION="$SOURCE_SHA" --build-arg BUILD_RUN_ID="$BUILD_ID" --build-arg BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --tag velora-probe-check deployment/probe
      - name: Verify actual image health, revision and unprivileged runtime
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/check-probe-container.mjs velora-probe-check "$SOURCE_SHA"
  register-development:
    needs: contracts-and-container
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VELORA_DEVELOPMENT_REGISTRATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/register-development-candidate.mjs
        env:
          VELORA_REGISTRATION_ENDPOINT: ${{ vars.VELORA_DEVELOPMENT_REGISTRATION_ENDPOINT }}
          ARTIFACT_ID: ${{ needs.contracts-and-container.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ needs.contracts-and-container.outputs.artifact-digest }}
