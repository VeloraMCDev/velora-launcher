# Velora on a single VPS behind an existing Traefik (for example a Pangolin stack).
# Copy to the deployment directory with .env, panel.env and ops.env; see README.md.
# Image digests are pinned in .env and changed by the operations dashboard Updates page.
name: velora-platform
services:
  panel:
    image: ${PANEL_IMAGE:?pin the tested ghcr.io/<owner>/velora-panel@sha256 digest in .env}
    container_name: velora-platform-panel
    restart: unless-stopped
    env_file: panel.env
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./panel-data:/data
    networks: [edge]
    mem_limit: 512m
  docs:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: velora-platform-docs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./docs-site:/usr/share/nginx/html:ro
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    mem_limit: 64m
  ops:
    image: ${OPS_IMAGE:?pin the tested ghcr.io/<owner>/velora-operations@sha256 digest in .env}
    container_name: velora-platform-ops
    restart: unless-stopped
    env_file: ops.env
    environment:
      STACK_DIR: ${STACK_DIR:?set STACK_DIR to this directory}
      STACK_PROJECT: velora-platform
    read_only: true
    tmpfs:
      - /tmp:rw,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The Docker socket is root-equivalent: protect this service with SSO in front of Traefik.
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the host docker group id}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_DIR}:${STACK_DIR}
      - ./ops-data:/data
      - /var/lib/velora-backup:/backup-state
      - /var/backups/velora:/backup-archives:ro
    networks: [edge]
    mem_limit: 256m
networks:
  edge:
    name: ${EDGE_NETWORK:-pangolin_frontend}
    external: true
