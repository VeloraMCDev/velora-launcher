# Static documentation (docs/dist) served by nginx-unprivileged on port 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

  location / { try_files $uri $uri/ =404; }
  location /assets/ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff always; }
  location = /search-index.json { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location ~ ^/(artifact-manifest\.json|_headers)$ { return 404; }
  error_page 404 /index.html;
}
