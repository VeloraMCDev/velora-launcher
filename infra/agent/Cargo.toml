[package]
name = "velora-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/VeloraMCDev/velora-launcher"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
toml = "0.8"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
