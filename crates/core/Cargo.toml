[package]
name = "scopenet-core"
description = "Minecraft install / launch engine used by the SCOPENET launcher (and meta lookups in the panel)"
version.workspace = true
edition.workspace = true

[dependencies]
scopenet-shared.workspace = true
velora-platform-utils.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
sha1.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
zip.workspace = true
tracing.workspace = true
fastnbt = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
