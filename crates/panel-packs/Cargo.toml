[package]
name = "velora-panel-packs"
version.workspace = true
edition.workspace = true
license = "MIT"
repository = "https://github.com/VeloraMCDev/velora-launcher"
publish = false

[dependencies]
velora-platform-contracts = { path = "../../packages/rust-platform-contracts" }
velora-platform-utils = { path = "../../packages/packs-platform-utils" }
velora-panel-instances = { path = "../panel-instances" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
[dev-dependencies]
tempfile = "3"
axum = "0.8"
