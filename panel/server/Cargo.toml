[package]
name = "velora-panel"
description = "Velora admin panel: manages instances, branding and players for the launcher"
version.workspace = true
edition.workspace = true

[dependencies]
velora-experiences-storage.workspace = true
velora-experiences-gameplay.workspace = true
velora-shared.workspace = true
velora-platform-utils.workspace = true
velora-auth-core = { workspace = true, features = ["sqlite", "textures"] }
velora-auth-http.workspace = true
velora-panel-activity.workspace = true
velora-panel-communications.workspace = true
velora-panel-instances.workspace = true
velora-panel-packs.workspace = true
velora-panel-settings.workspace = true
velora-panel-distribution.workspace = true
velora-platform-contracts.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
sha1.workspace = true
hex.workspace = true
uuid.workspace = true
zip.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing.workspace = true
chrono.workspace = true
rand.workspace = true
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
percent-encoding = "2"
sha2.workspace = true
base64.workspace = true
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
serde_yaml = "0.9"

[dev-dependencies]
rsa = { version = "0.9", features = ["sha1", "pem"] }
tempfile = "3"
