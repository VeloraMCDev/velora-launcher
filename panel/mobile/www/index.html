<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <title>Velora</title>
  <style>
    :root { color-scheme: dark; --accent: #6d6af5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(60% 50% at 20% 0%, #2a2a6a88, transparent 70%), #0d0e12; color: #ecedf1; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 4px; box-shadow: 0 12px 36px -10px var(--accent); }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.04em; }
    p { margin: 0; color: #8b8f9a; }
    input, button { font: inherit; border-radius: 14px; padding: 14px 16px; border: 1px solid #ffffff1f; width: 100%; }
    input { background: #16181e; color: inherit; }
    button { background: linear-gradient(180deg, #8b88f8, var(--accent)); color: #fff; font-weight: 650; border: 0; }
    .err { color: #f59ca0; min-height: 1.4em; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316181e'/%3E%3Ccircle cx='32' cy='32' r='14.5' fill='none' stroke='%23ecedf1' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%236d6af5'/%3E%3Cpath d='M32 12.5v7.5M32 44v7.5M12.5 32h7.5M44 32h7.5' stroke='%23ecedf1' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" alt="" />
    <h1>Velora</h1>
    <p>Enter your server's address to open your player panel.</p>
    <form id="f" autocomplete="off">
      <input id="u" type="url" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://panel.example.com" required />
      <div class="err" id="e" role="alert"></div>
      <button type="submit">Connect</button>
    </form>
  </main>
  <script>
    // Used only when the app was built without a PANEL_URL. The address is remembered on this device.
    const KEY = 'scopenet.panel.url';
    const go = (url) => { location.replace(url.replace(/\/+$/, '') + '/#/play'); };
    let saved = '';
    try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
    if (saved && !location.search.includes('change')) go(saved);
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const err = document.getElementById('e');
      let url = document.getElementById('u').value.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      // No reachability probe here: this page runs on the app's own origin, and a cross-origin fetch to the panel is blocked.
      try { localStorage.setItem(KEY, url); } catch (e) {}
      go(url);
    });
  </script>
</body>
</html>
