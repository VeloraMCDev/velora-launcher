name: Native agent checks and immutable bootstrap artifact
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: agent-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustup target add x86_64-unknown-linux-musl --toolchain 1.98.1
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: cargo +1.98.1 fmt --all --check
      - run: cargo +1.98.1 test --workspace --locked
      - run: cargo +1.98.1 clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo +1.98.1 build --release --locked --target x86_64-unknown-linux-musl --bin velora-agent
      - run: target/x86_64-unknown-linux-musl/release/velora-agent --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/agent-artifact.mjs
      - name: Verify first-install bootstrap on the disposable Linux runner
        run: |
          bash -n agent/install.sh
          manifest_checksum=$(sha256sum dist/agent/artifact-manifest.json | cut -d ' ' -f 1)
          sudo bash dist/agent/install.sh install "$PWD/dist/agent" "$manifest_checksum" https://control.example.com
          test "$(sudo stat -c '%a %U' /etc/velora-agent/identity.key)" = '600 velora-agent'
          test "$(id -nG velora-agent)" = 'velora-agent'
          if sudo bash dist/agent/install.sh install "$PWD/dist/agent" "$manifest_checksum" https://control.example.com; then exit 1; fi
          test "$(sudo stat -c '%a %U' /etc/velora-agent/identity.key)" = '600 velora-agent'
          if systemctl is-active --quiet velora-agent.service; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: velora-agent-linux-amd64-${{ github.sha }}
          path: dist/agent
          retention-days: 14
          if-no-files-found: error
