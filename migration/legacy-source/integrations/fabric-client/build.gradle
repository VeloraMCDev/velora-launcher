plugins { id 'fabric-loom' version '1.8.13' }
// Client-only companion to the SCOPENET plugin / Fabric server mod. Fabric 1.20.1.
// It needs nothing from `common`: the messages are plain JSON inside a Minecraft UTF string.
java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
base.archivesName = 'scopenet-client-fabric-1.20.1'
