plugins { id 'net.fabricmc.fabric-loom' version '1.17.17' }
def target = providers.gradleProperty('mcVersion').getOrElse('26.3')
if (target != '26.3') throw new GradleException('The modern companion targets Minecraft 26.3; use -PmcVersion=1.20.1 for the legacy client.')
java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.main.java.setSrcDirs(['src/26/java'])
sourceSets.main.resources.setSrcDirs(['src/26/resources'])
sourceSets.test.java.setSrcDirs(['src/26/test/java'])
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
base.archivesName = 'scopenet-client-fabric-26.3'
