# SCOPENET for Fabric (server side)  ->  config/scopenet.properties
# Same panel as the Paper plugin. Sign-in, stats, claims and the Live Map work on every supported Fabric version.
# Commands, permissions, placeholders and the client link need Fabric API and are in the Fabric 1.20.1 build.
# Extra files the mod creates: config/scopenet/essentials.json (homes, warps), guild-homes.json, economy-pending.json.

# --- Connection (required) ---------------------------------------------------
# Your panel address and the token from Servers -> this server in the panel.
panel-url=https://panel.example.com
token=

# --- Feature toggles (same meaning as the Paper plugin) ----------------------
leveling.enabled=true
leveling.global_xp_multiplier=1.0
leveling.server_xp_multiplier=1.5
quests.enabled=true
achievements.enabled=true
guilds.enabled=true
guilds.land_claiming=true
social.enabled=true
social.chat_prefixes=true
essentials.enabled=true
economy.enabled=true

# Draw this world on the SCOPENET Map: tiles, player positions, guild land and pins go to the panel
# (also needs the map switched on for this server in the panel, which it is by default).
map.enabled=true

# --- Essentials (1.20.1) -----------------------------------------------------
# /spawn /home /sethome /delhome /back /tpa /tpaccept /tpdeny /rtp /warp /playtime
# Homes every player can set. Raise it for a rank with a permission node: scopenet.homes.10 gives 10 homes,
# scopenet.homes.25 gives 25 (highest wins), scopenet.homes.unlimited removes the limit.
essentials.max_homes=5
essentials.home_name_max_length=32
# Most warps the server may have (0 = no limit).
essentials.max_warps=0
essentials.tpa_timeout_seconds=60
# /rtp picks a random safe spot between rtp_min_radius and rtp_radius blocks from 0,0.
essentials.rtp_radius=2500
essentials.rtp_min_radius=0
essentials.rtp_attempts=15
# Seconds between uses (0 = none). Starts when the command actually teleports.
# Players with scopenet.cooldown.bypass skip all of these.
essentials.cooldown.spawn=0
essentials.cooldown.home=0
essentials.cooldown.back=0
essentials.cooldown.tpa=0
essentials.cooldown.rtp=0
essentials.cooldown.warp=0

# --- Economy (1.20.1) --------------------------------------------------------
# Shown next to amounts.
economy.currency_symbol=$

# --- Permissions (1.20.1) ----------------------------------------------------
# With the LuckPerms mod installed, its answer wins. Use the same nodes as the Paper plugin
# (scopenet.command.home, scopenet.command.guild.bank.withdraw, scopenet.claims.bypass ...).
# Without LuckPerms, or when LuckPerms has no setting for a node:
#   all : every player may use ordinary commands
#   op  : only operators may
# Admin nodes (/scopenet status and reload, scopenet.claims.bypass) always need operator level 2 by default.
permissions.default_level=all

# --- Placeholder API (1.20.1) ------------------------------------------------
# With Placeholder API installed, registers %scopenet:level%, %scopenet:guild%, %scopenet:balance%,
# %scopenet:playtime%, %scopenet:quest_progress% and the rest of the Paper placeholder list.
placeholders.enabled=true

# --- Client mod link (1.20.1) ------------------------------------------------
# Send balance, level, guild and claim info to players who have the SCOPENET client mod.
clientlink.enabled=true

# --- Map pins ----------------------------------------------------------------
# Show every player's homes as pins on the map. Off by default: homes are private.
map.show_homes=false

# --- Rewards -----------------------------------------------------------------
# Quests, achievements and rank milestones can give items, permissions, groups, messages... (set in the admin panel).
rewards.enabled=true
# Let the panel run its own console commands as rewards. Leave off unless you trust every panel admin.
rewards.allow_commands=false
rewards.permission_command=lp user {player} permission set {node} true
rewards.permission_deny_command=lp user {player} permission set {node} false
rewards.permission_temp_command=lp user {player} permission settemp {node} {value} {duration}
rewards.group_command=lp user {player} parent add {group}
