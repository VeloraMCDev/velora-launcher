name: Runner setup
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux image and JAR dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust and system packages
        run: bash scripts/ci/install-linux.sh rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/ci/install-linux.sh java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash scripts/ci/install-linux.sh java 25
      - id: docker
        run: |
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-docker-action@v5
        if: steps.docker.outputs.ready != 'true'
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/ci/install-linux.sh image

  windows:
    name: Windows installer dependencies
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PowerShell, Rust and MSVC
        shell: powershell
        run: .\scripts\ci\install-windows.ps1
