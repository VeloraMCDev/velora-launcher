name: Checks

# Run by hand from the Actions tab. Compiles and tests everything without publishing anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the admin site (the panel embeds it)
        working-directory: panel/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: cargo test -p scopenet-panel -p scopenet-core --no-fail-fast

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        project: [panel/web, launcher]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.project }}
      - run: npm run check
        working-directory: ${{ matrix.project }}
      - run: npm run check:runes
        working-directory: ${{ matrix.project }}
      - run: npm run build
        working-directory: ${{ matrix.project }}

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Shared code tests and the Paper plugin
        run: gradle -p integrations --console=plain :common:test :paper:build

  client:
    name: Fabric 26.3 companion
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and test the in-game companion
        run: gradle -p integrations --console=plain -Ploader=fabric-client -PmcVersion=26.3 :fabric-client:build :common:test

  launcher:
    name: Launcher (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Linux system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the launcher UI (Tauri embeds it)
        working-directory: launcher
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: cargo test -p scopenet-launcher
