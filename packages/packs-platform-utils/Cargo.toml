[package]
name = "velora-platform-utils"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/VeloraMCDev/velora-launcher"

[dependencies]
velora-shared = { package = "velora-platform-contracts", version = "0.1.0", path = "../rust-platform-contracts" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true

[workspace]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
semver = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2", "gzip"] }
futures = "0.3"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
