name: Source CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    # Standard hosted runners are free once public. No exhausted private quota use.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            docs/package-lock.json
      - run: node scripts/verify-identity.mjs
      - run: node scripts/check-publication.mjs --checkout
      - name: Install verified secret scanner
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: node scripts/check-secrets.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: infra
      - run: node infra/scripts/check-workflows.mjs .
      - name: Check Deployment Panel controls
        run: |
          node --test panel/deployment-ui/client.test.mjs panel/deployment-ui/probe-plan.test.mjs
          node --check panel/deployment-ui/app.mjs
      - run: npm test
        working-directory: infra
      - run: npx --no-install tsc -p control-plane/tsconfig.json
        working-directory: infra
      - run: npm ci --no-audit --no-fund
        working-directory: docs
      - run: npm test && npm run check && npm run build
        working-directory: docs
