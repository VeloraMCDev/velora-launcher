name: Velora Paper Plugin
# Builds JUST the Velora Paper (26.3+) server integration plugin JAR
# and uploads it as a workflow artifact.

on:
  push:
    branches: [main]
    paths:
      - 'integrations/paper/**'
      - 'integrations/build.gradle'
      - 'integrations/settings.gradle'
      - '.github/workflows/paper-plugin.yml'
  pull_request:
    paths:
      - 'integrations/paper/**'
      - 'integrations/build.gradle'
      - 'integrations/settings.gradle'
      - '.github/workflows/paper-plugin.yml'
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: paper-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Normalize wrapper line endings
        run: |
          tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew && chmod +x gradlew

      - name: Build Paper plugin JAR and run tests
        run: ./gradlew :paper:build --no-daemon

      - name: Upload Paper plugin JAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: velora-paper-jar
          path: integrations/paper/build/libs/velora-paper-*.jar
          if-no-files-found: error
          retention-days: 14
