name: Application testing artifacts
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/verify-identity.mjs
  web:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        project: [ panel/web, launcher ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run check:runes
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-validation-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ matrix.project }}/dist/
          if-no-files-found: error
          retention-days: 3
  panel:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: panel/web
      - run: cargo test --locked -j 2 -p velora-panel -p velora-launcher-core -p
          velora-experiences-gameplay -p velora-experiences-storage
          --no-fail-fast
      - name: Build the testing image without publishing
        run: docker build --platform linux/amd64 --build-arg VELORA_BUILD_REVISION="$GITHUB_SHA" --tag velora-panel:testing .
      - run: node scripts/check-panel-container.mjs velora-panel:testing "$GITHUB_SHA"
      - run: python3 .github/scripts/test-panel-image.py velora-panel:testing
      - name: Export the tested image
        run: |
          mkdir -p testing-artifacts
          docker save velora-panel:testing | gzip > testing-artifacts/velora-panel-linux-amd64.tar.gz
          cd testing-artifacts
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panel-validation-${{ github.sha }}
          path: testing-artifacts/
          if-no-files-found: error
          retention-days: 3
  operations:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test without publishing
        run: docker build --platform linux/amd64 --build-arg OPS_REVISION="$GITHUB_SHA" --tag velora-operations:testing panel/operations
      - name: Smoke-test the exact image
        run: |
          docker run -d --name ops-smoke --read-only --tmpfs /tmp --tmpfs /data:uid=1000 --cap-drop ALL \
            -e OPS_INSECURE_COOKIES=1 -e PANEL_INTERNAL_URL=http://127.0.0.1:9 -p 127.0.0.1:18080:8080 velora-operations:testing
          for attempt in $(seq 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Velora Operations'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/overview)" = 401
          test "$(docker inspect --format '{{.Config.User}}' ops-smoke)" = node
      - name: Clean up smoke container
        if: always()
        run: docker rm -f ops-smoke || true
      - name: Export the tested image
        run: |
          mkdir -p testing-artifacts
          docker save velora-operations:testing | gzip > testing-artifacts/velora-operations-linux-amd64.tar.gz
          cd testing-artifacts
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-validation-${{ github.sha }}
          path: testing-artifacts/
          if-no-files-found: error
          retention-days: 3
  docs:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run check && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-validation-${{ github.sha }}
          path: docs/dist/
          if-no-files-found: error
          retention-days: 3
  desktop:
    needs: source
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, name: Windows, bundles: nsis }
          - { runner: ubuntu-22.04, name: Linux, bundles: 'appimage,deb' }
          - { runner: macos-latest, name: macOS, bundles: 'app,dmg' }
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libssl-dev libxdo-dev
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo test --locked -j 2 -p velora-launcher
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher-validation-${{ matrix.name }}-${{ github.sha }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 7
