name: Complete private applications
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/verify-identity.mjs
  web:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        project: [ panel/web, launcher ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run check:runes
      - run: npm run build
  panel:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: panel/web
      - run: cargo test --locked -j 2 -p scopenet-panel -p scopenet-core -p
          velora-experiences-gameplay -p velora-experiences-storage
          --no-fail-fast
      - run: docker build --target web --progress=plain .
  desktop:
    needs: source
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, name: Windows, bundles: nsis }
          - { runner: ubuntu-22.04, name: Linux, bundles: 'appimage,deb' }
          - { runner: macos-latest, name: macOS, bundles: 'app,dmg' }
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libssl-dev libxdo-dev
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo test --locked -j 2 -p scopenet-launcher
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher-validation-${{ matrix.name }}-${{ github.sha }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 7
