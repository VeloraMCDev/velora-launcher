name: Application install and restore acceptance
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: application-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/verify-identity.mjs
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: panel/web
      - run: cargo build --locked -j 2 -p scopenet-panel
      - run: node scripts/application-acceptance.mjs target/debug/scopenet-panel
