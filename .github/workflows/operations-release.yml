name: Build immutable Operations image
# Manual: builds the operations dashboard once, smoke-tests that exact image and
# publishes it to GHCR. Deploy it from the dashboard's Updates page (or compose).
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: operations-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact release image coordinates
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/velora-operations" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPS_VERSION=$(node -p "require('./panel/operations/package.json').version")+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build once (runs type checks and server tests)
        run: docker build --platform linux/amd64 --build-arg OPS_VERSION="$OPS_VERSION" --build-arg OPS_REVISION="$GITHUB_SHA" --tag "$IMAGE:$IMAGE_TAG" panel/operations
      - name: Smoke-test the exact image
        run: |
          docker run -d --name ops-smoke --read-only --tmpfs /tmp --tmpfs /data:uid=1000 --cap-drop ALL \
            -e OPS_INSECURE_COOKIES=1 -e PANEL_INTERNAL_URL=http://127.0.0.1:9 -p 127.0.0.1:18080:8080 "$IMAGE:$IMAGE_TAG"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q "$OPS_VERSION"
          curl -fsS http://127.0.0.1:18080/ | grep -q "Velora Operations"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/overview)" = 401
          test "$(docker inspect --format '{{.Config.User}}' ops-smoke)" = node
          docker rm -f ops-smoke
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested bytes without rebuilding
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          echo "Published $(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG")" >> "$GITHUB_STEP_SUMMARY"
