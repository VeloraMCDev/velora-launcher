name: Calagopus extension
# Builds the Velora Core extension against the Calagopus panel (Rust tests, frontend typecheck and build) and uploads
# the package. release-1.2.4 is the supported panel version and must pass; main is the next panel and is informational.
# Manual: run it from the Actions tab after changing the extension. Nothing is published or installed anywhere.
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  extension:
    name: extension (panel ${{ matrix.panel_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.panel_ref == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        panel_ref: [release-1.2.4, main]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check out the Calagopus panel
        env:
          PANEL_REF: ${{ matrix.panel_ref }}
        run: |
          git clone --depth 1 --branch "$PANEL_REF" https://github.com/calagopus/panel.git "$RUNNER_TEMP/panel"
          cp -r integrations/calagopus/net_velora_core "$RUNNER_TEMP/panel/backend-extensions/"
          # What `panel-rs extensions add` sets up for an extension (the panel's create_compat_links): a generated
          # tsconfig.json so "@/..." resolves, the frontend reachable under frontend/extensions, and the panel's
          # node_modules reachable from backend-extensions, since extensions import panel dependencies undeclared.
          cd "$RUNNER_TEMP/panel"
          cat > backend-extensions/net_velora_core/frontend/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "jsx": "react-jsx",
              "moduleResolution": "bundler",
              "module": "esnext",
              "target": "esnext",
              "allowImportingTsExtensions": true,
              "noEmit": true,
              "paths": { "@/*": ["../../../frontend/src/*"] },
              "types": ["../../../frontend/src/vite-env.d.ts"]
            },
            "include": ["src"]
          }
          EOF
          ln -s ../../backend-extensions/net_velora_core/frontend frontend/extensions/net_velora_core
          ln -s ../frontend/node_modules backend-extensions/node_modules
      - name: Install the panel's Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The panel's Rust build embeds the built frontend, so the frontend (and this extension's typecheck) comes first.
      - name: Frontend typecheck and build
        working-directory: ${{ runner.temp }}/panel/frontend
        run: |
          npm install --global pnpm@11
          pnpm install --frozen-lockfile=false
          pnpm build:ci
      - name: Rust tests
        working-directory: ${{ runner.temp }}/panel
        run: cargo test -p net_velora_core --ignore-rust-version
      - name: Build the panel CLI
        working-directory: ${{ runner.temp }}/panel
        # No DATABASE_URL here: with one set, sqlx would check queries against a live database instead of the
        # panel's checked-in .sqlx cache.
        run: cargo build -p panel-rs --ignore-rust-version
      - name: Export the extension package
        working-directory: ${{ runner.temp }}/panel
        # The CLI insists on its environment being present; export itself never connects to anything, so these are
        # throwaway values that exist only for this step.
        env:
          DATABASE_URL: postgresql://unused:unused@localhost/unused
          REDIS_URL: redis://localhost
        run: |
          APP_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64) ./target/debug/panel-rs extensions export net.velora.core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: net-velora-core-calagopus-extension-${{ matrix.panel_ref }}
          path: ${{ runner.temp }}/panel/exported-extensions/*.c7s.zip
          if-no-files-found: error
          retention-days: 14
