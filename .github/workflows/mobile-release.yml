name: Mobile app builds
on:
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELORA_PANEL_URL: ${{ vars.VELORA_DEFAULT_PANEL_URL }}
      VELORA_REQUIRE_ANDROID_SIGNING: '1'
    defaults:
      run:
        working-directory: panel/mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Load the existing Android signing identity
        env:
          VELORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.VELORA_ANDROID_KEYSTORE_BASE64 }}
        run: node materialize-keystore.mjs
      - run: npm run prepare:android
      - name: Build and verify signed APK
        env:
          VELORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VELORA_ANDROID_KEYSTORE_PASSWORD }}
          VELORA_ANDROID_KEY_PASSWORD: ${{ secrets.VELORA_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          version=$(node -p "require('../package.json').version")
          mkdir -p ../../../dist-mobile
          cp app/build/outputs/apk/release/app-release.apk "../../../dist-mobile/Velora-Player_${version}_android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-android
          path: dist-mobile/*.apk
          if-no-files-found: error
          retention-days: 3
  ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VELORA_PANEL_URL: ${{ vars.VELORA_DEFAULT_PANEL_URL }}
    defaults:
      run:
        working-directory: panel/mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - run: npm run prepare:ios
      - name: Build a device IPA for personal AltStore signing
        run: |
          version=$(node -p "require('./package.json').version")
          build_number=$(node -p "require('./package.json').version.split('.').reduce((code,part)=>code*1000+Number(part),0)")
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build_number" build
          mkdir -p ../../dist-mobile/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app ../../dist-mobile/Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ../../dist-mobile/Payload/App.app/Info.plist | grep -Fx net.scopenet.player
          cd ../../dist-mobile
          zip -qr "Velora-Player_${version}_ios.ipa" Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-ios
          path: dist-mobile/*.ipa
          if-no-files-found: error
          retention-days: 3
